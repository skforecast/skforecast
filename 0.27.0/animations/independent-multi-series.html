<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Independent multi-series forecasting</title>
<meta name="description" content="Animated explanation of independent multi-series forecasting with ForecasterRecursiveMultiSeries: the sliding windows of several series, with different lengths and different exogenous variables, are stacked into a single table used to train one model that forecasts all of them.">
<link rel="stylesheet" href="skf-anim.css">
</head>
<body>
<div class="skf-anim"></div>
<script src="skf-anim.js"></script>
<script>
(function(){
"use strict";
const {cl, ease, lin, P, lerp, V, mw, text, rect, line, circle, path, polyline, arrow, chip, header} = SkfAnim;

/* ------------------------------------------------------------------ data */
// Three stores, daily sales. 2026-01-05 is a Monday (k = 0); k = 10 is forecast.
// Store C opened later. Each store has its own exogenous variables.
const S = [
  {name:'Store A', id:0, c:'s1', k0:0, lo:44, hi:70, yf:64.1,
   y:[62.1,64.8,63.5,61.2,60.4,48.7,46.9,63.8,66.2,65.0],
   exog:{temp:[12.1,11.4,13.0,14.2,13.6,15.1,14.8,12.5,11.9,13.4,14.9]}},
  {name:'Store B', id:1, c:'s2', k0:0, lo:28, hi:52, yf:48.9,
   y:[41.3,47.9,42.6,40.8,46.5,33.2,31.4,42.2,48.6,43.1],
   exog:{temp:[11.8,11.0,12.6,13.9,13.1,14.7,14.5,12.2,11.6,13.0,14.4], promo:[0,1,0,0,1,0,0,0,1,0,1]}},
  {name:'Store C', id:2, c:'s3', k0:4, lo:18, hi:36, yf:29.8,
   y:[null,null,null,null,27.4,22.1,20.8,28.9,33.0,29.3],
   exog:{promo:[null,null,null,null,0,0,0,0,1,0,0]}}
];
const EXOG = ['temp', 'promo'];
const NAN  = 'NaN';
const f1   = v => v.toFixed(1);
const DATE = k => 'Jan ' + String(5 + k).padStart(2, '0');
const fmtExog = (e, v) => e === 'promo' ? String(v) : f1(v);

// Training matrix, as built by ForecasterRecursiveMultiSeries.create_train_X_y:
// rows of each series stacked one after another, exogenous columns are the
// union of all series (NaN where a series does not have the variable).
const ROWS = [];
function makeRow(si, k, target, j){
  const s = S[si], Y = s.y;
  const r = {si, k, j, date: DATE(k), lag_1: f1(Y[k-1]), lag_2: f1(Y[k-2]), lag_3: f1(Y[k-3]),
    series: String(s.id), y: f1(target)};
  for (const e of EXOG) r[e] = s.exog[e] ? fmtExog(e, s.exog[e][k]) : NAN;
  return r;
}
S.forEach((s, si) => { for (let k = s.k0 + 3; k <= 9; k++) ROWS.push(makeRow(si, k, s.y[k], k - s.k0 - 3)); });
const NTRAIN = ROWS.length;
S.forEach((s, si) => ROWS.push(makeRow(si, 10, s.yf, 0)));

/* -------------------------------------------------------------- timeline */
const T = {
  panels:[0.1,0.7], draw:[0.6,3.4], exog:[4.2,5.6], later:[4.6,5.2], laterOut:[8.4,9.0],
  head:[8.6,9.2], rows0:9.2, slow:3.6, medium:2.0, fast:.45, winOut:[23.1,23.5],
  seriesCol:[15.5,23.1], brackets:[23.4,23.9], nan:[26.2,29.0],
  model:[29.0,29.6], fitArrow:[29.6,30.2], fitBar:[29.8,31.6], sweep:30.0,
  predCode:[33.0,33.4], predArrow:[33.4,34.2], pred:[34.4,35.0], fly:[37.0,38.2], land:38.2,
  fadeOut:[42.5,43.3], total:43.3
};
const RS = [], RD = [];
{
  let t = T.rows0;
  for (let i = 0; i < NTRAIN; i++){
    const r = ROWS[i];
    const d = r.j > 0 ? T.fast : r.si === 0 ? T.slow : T.medium;
    RS.push(t); RD.push(d); t += d;
  }
}
const CAPTIONS = [
  [0.0, 4.2, 'Three stores share a weekly pattern at different levels.'],
  [4.2, 8.6, 'Their histories have different lengths, and each store has its own exogenous variables.'],
  [8.6, 15.5,'The sliding windows of all the stores are stacked into a single training table.'],
  [15.5,23.4,'The series column tells the model which store each row comes from.'],
  [23.4,26.2,'Each store adds as many rows as its history allows.'],
  [26.2,29.0,'Exogenous variables that a store does not have are filled with NaN.'],
  [29.0,33.0,'A single estimator learns from all the rows. Models such as LightGBM handle NaN natively.'],
  [33.0,37.0,'To forecast, each store gets a new row with its own last values and exogenous variables.'],
  [37.0,99,  'The same model forecasts every store, each one from its own data.']
];
const STEPS = [['Series',0,8.6],['Training table',8.6,29.0],['Fit',29.0,33.0],['Predict',33.0,99]];

/* ---------------------------------------------------------------- layout */
const CX0 = 112, DX = 38, xk = k => CX0 + k*DX;        // series panels
const PX0 = 36, PX1 = 524;
{
  let top = 118;
  for (const s of S){
    s.strips = EXOG.filter(e => e in s.exog);
    s.top = top; s.SA0 = top + 26; s.SA1 = top + 80;
    s.bot = top + 92 + s.strips.length*22;
    top = s.bot + 12;
    s.n = s.y.filter(v => v !== null).length;
    s.badge = 'series ' + s.id;
  }
}
const yv = (s, v) => s.SA1 - 4 - (v - s.lo)/(s.hi - s.lo)*(s.SA1 - s.SA0 - 8);
const badgeW = s => mw(s.badge, 11.5, 700, 'm') + 12;   // measured per frame (fonts load late)
const stripY = (s, e) => s.top + 96 + s.strips.indexOf(e)*22;
const exogY  = (s, e, v) => e === 'temp' ? stripY(s, e) + 7 - (v - 10.5)/(16 - 10.5)*14 : stripY(s, e);
const MX0 = 36, MX1 = 524, MY0 = 522, MY1 = 604;        // global model box
const TX0 = 620, RY0 = 160, RH = 21;                    // table
const COLS = [
  {key:'date',   w:66, c:'muted'},
  {key:'lag_1',  w:60, c:'lag'},
  {key:'lag_2',  w:60, c:'lag'},
  {key:'lag_3',  w:60, c:'lag'},
  {key:'series', w:66, c:'series'},
  {key:'temp',   w:60, c:'exog'},
  {key:'promo',  w:64, c:'exog'},
  {key:'y',      w:62, c:'target', gap:14}
];
let TX1 = TX0;
for (const c of COLS){ if (c.gap) TX1 += c.gap; c.x = TX1; TX1 += c.w; }
const COL = Object.fromEntries(COLS.map(c => [c.key, c]));
const rowY = i => RY0 + i*RH + (i >= NTRAIN ? 2*5 + 14 : ROWS[i].si*5);
const cellX = key => COL[key].x + COL[key].w/2;

/* ------------------------------------------------------- derived state */
// Sliding window over the panel of the row being built.
function windowState(t){
  const a = P(t, T.rows0 - .35, T.rows0 + .05)*(1 - P(t, ...T.winOut));
  let i = -1;
  for (let j = 0; j < NTRAIN; j++) if (t >= RS[j]) i = j;
  if (i < 0) return {i:0, si:0, k:3, a};
  const r = ROWS[i];
  if (r.j === 0) return {i, si:r.si, k:r.k, a: a*(i === 0 ? 1 : lin(t, RS[i], RS[i] + .25))};
  return {i, si:r.si, k: r.k - 1 + ease(cl((t - RS[i])/RD[i]/.4)), a};
}
// Values that fly from the panel to the table in the first row of each series.
const FLIGHT_KEYS = ['lag_1', 'lag_2', 'lag_3', 'series', 'temp', 'promo', 'y'];
function flightsFor(i){
  const r = ROWS[i], s = S[r.si], st = RS[i], d = RD[i];
  return FLIGHT_KEYS.filter(key => r[key] !== NAN).map((key, j) => {
    const fs = st + d*(.22 + j*.07);
    let x0 = xk(r.k), y0, c;
    if (key.startsWith('lag')){ const n = +key.slice(4); x0 = xk(r.k - n); y0 = yv(s, s.y[r.k - n]); c = 'lag'; }
    else if (key === 'y'){ y0 = yv(s, s.y[r.k]); c = 'target'; }
    else if (key === 'series'){ x0 = 52 + mw(s.name, 14, 700) + 10 + badgeW(s)/2; y0 = s.top + 10; c = s.c; }
    else { y0 = exogY(s, key, s.exog[key][r.k]); c = 'exog'; }
    return {key, fs, fe: fs + d*.3, x0, y0, c, v: r[key]};
  });
}
function cellTiming(t, i, key){
  if (i >= NTRAIN){
    if (key === 'y') return {a: lin(t, T.land, T.land + .15), flash: .45*(1 - lin(t, T.land, T.land + .9))};
    const s = T.pred[0] + (i - NTRAIN)*.18 + COLS.indexOf(COL[key])*.04;
    return {a: lin(t, s, s + .25), flash: .3*(1 - lin(t, s + .1, s + .7))};
  }
  const r = ROWS[i], st = RS[i], d = RD[i];
  if (key === 'date') return {a: lin(t, st + d*.08, st + d*.25), flash: 0};
  if (r.j === 0){
    if (r[key] === NAN) return {a: lin(t, st + d*.55, st + d*.75), flash: 0};
    const f = flightsFor(i).find(q => q.key === key);
    return {a: lin(t, f.fe - .04, f.fe + .1), flash: .4*(1 - lin(t, f.fe, f.fe + .7))};
  }
  return {a: lin(t, st + d*.25, st + d*.7), flash: .35*(1 - lin(t, st + d*.5, st + d*1.3))};
}

/* ----------------------------------------------------------------- scenes */
// Points of a series up to (fractional) time kmax, interpolating the last segment.
function upTo(pts, kmax){
  const out = [];
  for (let n = 0; n < pts.length; n++){
    const [k, x, y] = pts[n];
    if (k <= kmax){ out.push([x, y]); continue; }
    if (n > 0){
      const [kp, xp, yp] = pts[n-1], f = (kmax - kp)/(k - kp);
      if (f > 0) out.push([lerp(xp, x, f), lerp(yp, y, f)]);
    }
    break;
  }
  return out;
}

function drawWindow(o, s, k, a, dashed){
  if (a <= 0) return;
  const x0 = xk(k - 3) - 11, x1 = xk(k - 1) + 11, tx = xk(k);
  o.push(rect(x0, s.SA0 - 4, x1 - x0, s.SA1 - s.SA0 + 8, {rx:7, fill:V('lag'), fo:.09, stroke:V('lag'), so:.55, op:a}));
  o.push(rect(tx - 12, s.SA0 - 4, 24, s.bot - 8 - s.SA0 + 4, {rx:7, fill:V('target'), fo:.13, stroke:V('target'), so:.8, dash: dashed ? '4 3' : '', op:a}));
}

function panels(t, o){
  const pa = P(t, ...T.panels);
  const dp = P(t, ...T.draw)*9;
  const ep = P(t, ...T.exog)*9;
  const ea = P(t, T.exog[0], T.exog[0] + .4);
  const w = windowState(t);
  const pk = P(t, ...T.pred);
  const land = lin(t, T.land, T.land + .3);
  const colPulse = P(t, T.seriesCol[0], T.seriesCol[0] + .4)*(1 - P(t, T.seriesCol[1] - .4, T.seriesCol[1]));
  S.forEach((s, si) => {
    o.push(rect(PX0, s.top - 8, PX1 - PX0, s.bot - s.top + 8, {rx:10, fill:V('panel'), fo:.6, stroke:V('border'), so:.8, op:pa}));
    o.push(text(52, s.top + 14, s.name, {size:14, weight:700, op:pa}));
    const bx = 52 + mw(s.name, 14, 700) + 10, bw = badgeW(s);
    o.push(rect(bx, s.top + 1, bw, 18, {rx:5, fill:V(s.c), fo:.16, stroke:V(s.c), sw:1.5, so:colPulse, op:pa}));
    o.push(text(bx + bw/2, s.top + 14, s.badge, {size:11.5, cls:'m', weight:700, anchor:'middle', fill:V(s.c), op:pa}));
    o.push(text(PX1 - 14, s.top + 14, s.n + ' days', {size:12, anchor:'end', fill:V('muted'), op:pa*P(t, ...T.later)}));
    o.push(text(CX0 - 14, (s.SA0 + s.SA1)/2 + 4, 'sales', {size:11.5, anchor:'end', fill:V('muted'), op:pa}));
    o.push(line(CX0 - 6, s.SA1 + 1, xk(10) + 12, s.SA1 + 1, {op:pa}));

    // store C opened later
    if (s.k0 > 0){
      const la = P(t, ...T.later)*(1 - P(t, ...T.laterOut));
      o.push(rect(xk(0) - 10, s.SA0 - 2, xk(s.k0 - 1) - xk(0) + 20, s.SA1 - s.SA0 + 4, {rx:7, stroke:V('faint'), sw:1.2, dash:'4 4', op:la}));
      o.push(text((xk(0) + xk(s.k0 - 1))/2, (s.SA0 + s.SA1)/2 + 4, 'no history yet', {size:12, cls:'i', anchor:'middle', fill:V('muted'), op:la}));
    }

    // sliding window (training rows) and prediction window
    if (w.a > 0 && w.si === si) drawWindow(o, s, w.k, w.a);
    drawWindow(o, s, 10, pk, true);

    // exogenous strips
    for (const e of s.strips){
      const cy = stripY(s, e), vals = s.exog[e];
      o.push(text(CX0 - 14, cy + 4, e, {size:11.5, cls:'m', anchor:'end', fill:V('exog'), op:ea}));
      const pts = [];
      for (let k = s.k0; k <= 9; k++) pts.push([k, xk(k), exogY(s, e, vals[k])]);
      if (e === 'temp'){
        const vis = upTo(pts, ep);
        if (vis.length > 1) o.push(path(polyline(vis), {stroke:V('exog'), sw:1.6, op:ea}));
        o.push(line(xk(9), exogY(s, e, vals[9]), xk(10), exogY(s, e, vals[10]), {stroke:V('exog'), sw:1.6, dash:'3 3', op:pk}));
        o.push(circle(xk(10), exogY(s, e, vals[10]), 2.8, {fill:V('exog'), op:pk}));
      }
      for (let k = s.k0; k <= 10; k++){
        const a = k < 10 ? cl((ep - k + .35)/.35)*ea : pk;
        if (e === 'temp'){ if (k < 10) o.push(circle(xk(k), exogY(s, e, vals[k]), 2.4, {fill:V('bg'), stroke:V('exog'), sw:1.4, op:a})); }
        else o.push(rect(xk(k) - 5, cy - 5, 10, 10, {rx:2.5, fill: vals[k] ? V('exog') : 'none', stroke: vals[k] ? 'none' : V('faint'), sw:1.2, op:a}));
      }
    }

    // series line and points
    const pts = [];
    for (let k = s.k0; k <= 9; k++) pts.push([k, xk(k), yv(s, s.y[k])]);
    const vis = upTo(pts, dp);
    if (vis.length > 1) o.push(path(polyline(vis), {stroke:V('series'), sw:2.2, op:pa}));
    const kr = Math.round(w.k);
    for (let k = s.k0; k <= 9; k++){
      const a = cl((dp - k + .35)/.35)*pa;
      if (a <= 0) continue;
      const x = xk(k), y = yv(s, s.y[k]);
      o.push(circle(x, y, 3.8, {fill:V('bg'), stroke:V('series'), sw:1.8, op:a}));
      if (w.a > 0 && w.si === si){
        if (k >= kr - 3 && k <= kr - 1) o.push(circle(x, y, 4.9, {fill:V('lag'), op:w.a}));
        if (k === kr) o.push(circle(x, y, 5.4, {fill:V('target'), op:w.a}));
      }
      if (pk > 0 && k >= 7) o.push(circle(x, y, 4.9, {fill:V('lag'), op:pk}));
    }

    // forecast
    o.push(text(xk(10), (s.SA0 + s.SA1)/2 + 6, '?', {size:17, weight:700, anchor:'middle', fill:V('targetText'), op:pk*(1 - land)}));
    if (land > 0){
      const yF = yv(s, s.yf), q = lin(t, T.land, T.land + .9);
      o.push(line(xk(9), yv(s, s.y[9]), lerp(xk(9), xk(10), land), lerp(yv(s, s.y[9]), yF, land), {stroke:V('target'), sw:2.2, dash:'5 4'}));
      o.push(circle(xk(10), yF, 5.5 + 14*q, {stroke:V('target'), sw:2, op:(1 - q)*.7}));
      o.push(circle(xk(10), yF, 5.5, {fill:V('target'), op:land}));
    }
  });
}

function table(t, o){
  const head = P(t, ...T.head);
  if (head <= 0) return;
  const pk = P(t, ...T.pred);
  const rvP = lin(t, T.pred[0], T.pred[0] + .2);
  const rowVis = i => i >= NTRAIN ? rvP : lin(t, RS[i], RS[i] + .15);

  // group labels
  const gx0 = COL.lag_1.x + 2, gx1 = COL.promo.x + COL.promo.w - 2;
  const bracket = (x0, x1, c) => {
    o.push(line(x0, 121, x1, 121, {stroke:c, sw:1.2, op:head}));
    o.push(line(x0, 121, x0, 126, {stroke:c, sw:1.2, op:head}));
    o.push(line(x1, 121, x1, 126, {stroke:c, sw:1.2, op:head}));
  };
  bracket(gx0, gx1, V('border'));
  o.push(text((gx0 + gx1)/2, 114, 'features  X', {size:12.5, weight:700, anchor:'middle', fill:V('muted'), op:head}));
  bracket(COL.y.x + 2, COL.y.x + COL.y.w - 2, V('target'));
  o.push(text(cellX('y'), 114, 'target  y', {size:12.5, weight:700, anchor:'middle', fill:V('targetText'), op:head}));

  // header cells
  for (const c of COLS){
    o.push(rect(c.x + 1.5, 128, c.w - 3, 26, {rx:5, fill:V('panel'), op:head}));
    if (c.key === 'series'){
      const sw = (c.w - 8)/3;
      S.forEach((s, n) => o.push(rect(c.x + 4 + n*sw, 151, sw, 3, {fill:V(s.c), op:head})));
    } else {
      o.push(rect(c.x + 4, 151, c.w - 8, 3, {rx:1.5, fill: c.key === 'date' ? V('border') : V(c.c), op:head}));
    }
    o.push(text(c.x + c.w/2, 146, c.key, {size:12.5, cls:'m', weight: c.key === 'y' ? 700 : 400, anchor:'middle',
      fill: c.key === 'y' ? V('targetText') : c.key === 'date' ? V('muted') : V('fg'), op:head}));
  }

  // body tints and separators
  for (let i = 0; i < ROWS.length; i++){
    const rv = rowVis(i);
    if (rv <= 0) continue;
    const r = ROWS[i], y = rowY(i);
    for (const c of COLS){
      if (c.key === 'date') continue;
      const nan = r[c.key] === NAN;
      const fill = c.key === 'series' ? V(S[r.si].c) : V(c.c);
      const fo = nan ? .02 : c.key === 'y' ? .12 : c.key === 'series' ? .16 : .06;
      o.push(rect(c.x + 1.5, y, c.w - 3, RH, {fill, fo, op:rv}));
    }
    if (i < NTRAIN) o.push(line(TX0, y + RH, TX1, y + RH, {op:rv}));
  }
  o.push(line(TX0, rowY(NTRAIN) - 7, TX1, rowY(NTRAIN) - 7, {stroke:V('border'), dash:'4 4', sw:1.2, op:rvP}));

  // fit sweep
  for (let i = 0; i < NTRAIN; i++){
    const sw = cl(1 - Math.abs(t - (T.sweep + i*.07))/.25);
    if (sw > 0) o.push(rect(TX0 - 2, rowY(i) + 1, TX1 - TX0 + 4, RH - 2, {rx:4, fill:V('series'), fo:.13, op:sw}));
  }

  // cells
  const dim = 1 - .45*pk;
  const nanA = P(t, T.nan[0], T.nan[0] + .4)*(1 - P(t, T.nan[1] - .4, T.nan[1]));
  for (let i = 0; i < ROWS.length; i++){
    const r = ROWS[i], y = rowY(i);
    for (const c of COLS){
      const tm = cellTiming(t, i, c.key);
      if (tm.a <= 0) continue;
      const v = r[c.key], nan = v === NAN, isF = i >= NTRAIN && c.key === 'y';
      if (tm.flash > 0) o.push(rect(c.x + 2, y + 2, c.w - 4, RH - 4, {rx:4, fill: c.key === 'date' ? V('border') : c.key === 'series' ? V(S[r.si].c) : V(c.c), fo:tm.flash}));
      if (nan && i < NTRAIN) o.push(rect(c.x + 3, y + 2.5, c.w - 6, RH - 5, {rx:4, stroke:V('exog'), sw:1.5, op:nanA}));
      o.push(text(c.x + c.w/2, y + RH/2 + 4.3, v, {size: c.key === 'date' ? 11.5 : 12.5, cls:'m', weight: isF || c.key === 'series' ? 700 : 400, anchor:'middle',
        fill: c.key === 'date' || nan ? V('muted') : isF ? V('targetText') : c.key === 'series' ? V(S[r.si].c) : V('fg'),
        op: tm.a*(i < NTRAIN ? dim : 1)*(nan ? .8 : 1)}));
    }
  }

  // "?" placeholders in the prediction rows
  const q = lin(t, T.pred[0] + .5, T.pred[0] + .8)*(1 - lin(t, T.land - .05, T.land + .1));
  for (let i = NTRAIN; i < ROWS.length; i++){
    o.push(rect(COL.y.x + 5, rowY(i) + 2.5, COL.y.w - 10, RH - 5, {rx:4, stroke:V('target'), sw:1.3, dash:'3 3', op:q}));
    o.push(text(cellX('y'), rowY(i) + RH/2 + 4.5, '?', {size:13, weight:700, anchor:'middle', fill:V('targetText'), op:q}));
  }
  o.push(rect(TX0 - 3, rowY(NTRAIN) - 1, TX1 - TX0 + 6, 3*RH + 2, {rx:6, stroke:V('target'), sw:1.5, so:.9, op:lin(t, T.predArrow[1] - .25, T.predArrow[1])}));

  // row being built
  const w = windowState(t);
  if (w.a > 0 && t >= RS[w.i]) o.push(rect(TX0 - 3, rowY(w.i) - 1, TX1 - TX0 + 6, RH + 2, {rx:6, stroke:V('fg'), sw:1.3, so:.5, op:w.a}));

  // series column highlight
  const ca = P(t, T.seriesCol[0], T.seriesCol[0] + .4)*(1 - P(t, T.seriesCol[1] - .4, T.seriesCol[1]));
  const lastRow = [...RS.keys()].filter(i => t >= RS[i]).pop();
  if (lastRow !== undefined){
    const c = COL.series;
    o.push(rect(c.x, 127, c.w, rowY(lastRow) + RH + 2 - 127, {rx:6, stroke:V('fg'), sw:1.5, so:.55, op:ca}));
  }

  // rows per store
  const ba = P(t, ...T.brackets);
  S.forEach((s, si) => {
    const idx = ROWS.map((r, i) => i < NTRAIN && r.si === si ? i : -1).filter(i => i >= 0);
    const y0 = rowY(idx[0]) + 3, y1 = rowY(idx[idx.length - 1]) + RH - 3, x = TX1 + 10;
    o.push(path(`M${x} ${y0} h6 V${y1} h-6`, {stroke:V(s.c), sw:1.5, op:ba}));
    o.push(text(x + 14, (y0 + y1)/2 + 4.5, idx.length + ' rows', {size:12.5, weight:700, fill:V(s.c), op:ba}));
  });
  // predictions, labelled once the estimator has filled them
  const pa = lin(t, T.land, T.land + .4);
  const py0 = rowY(NTRAIN) + 3, py1 = rowY(ROWS.length - 1) + RH - 3, px = TX1 + 10;
  o.push(path(`M${px} ${py0} h6 V${py1} h-6`, {stroke:V('target'), sw:1.5, op:pa}));
  o.push(text(px + 14, (py0 + py1)/2 + 5.5, 'ŷ', {size:16, weight:700, fill:V('targetText'), op:pa}));
}

function model(t, o){
  const a = P(t, ...T.model);
  if (a <= 0) return;
  o.push(rect(MX0, MY0, MX1 - MX0, MY1 - MY0, {rx:12, fill:V('panel'), stroke:V('border'), sw:1.5, op:a}));
  o.push(text(MX0 + 22, MY0 + 32, 'One global estimator', {size:19, weight:700, op:a}));
  o.push(text(MX0 + 22, MY0 + 55, 'LightGBM · XGBoost · CatBoost · HistGradientBoosting', {size:13, fill:V('muted'), op:a}));
  const predOn = P(t, ...T.predCode);
  const fitOn = P(t, ...T.fitArrow)*(1 - predOn);
  o.push(text(MX1 - 22, MY0 + 32, '.fit(X, y)', {size:14, cls:'m', anchor:'end', op:a*fitOn}));
  o.push(text(MX1 - 22, MY0 + 32, '.predict(X)', {size:14, cls:'m', weight:700, anchor:'end', fill:V('targetText'), op:a*predOn}));
  const bw = MX1 - MX0 - 44;
  o.push(rect(MX0 + 22, MY1 - 16, bw, 4, {rx:2, fill:V('grid'), op:a}));
  o.push(rect(MX0 + 22, MY1 - 16, bw*lin(t, ...T.fitBar), 4, {rx:2, fill:V('series'), op:a*(1 - predOn)}));
  o.push(rect(MX0 + 22, MY1 - 16, bw*lin(t, T.fly[0], T.land), 4, {rx:2, fill:V('target'), op:a*predOn}));
  // fit: the training table feeds the estimator
  arrow(o, TX0 - 8, (RY0 + rowY(NTRAIN - 1) + RH)/2, MX1 + 4, MY0 + 26, P(t, ...T.fitArrow), V('series'), .85*(1 - predOn));
  // predict: the estimator produces the rows to forecast, then fills their target
  arrow(o, MX1 + 4, (MY0 + MY1)/2, TX0 - 8, rowY(NTRAIN) + 1.5*RH, P(t, ...T.predArrow), V('targetText'), 1);
}

function chips(t, o){
  for (let i = 0; i < NTRAIN; i++){
    if (ROWS[i].j !== 0 || t < RS[i] || t > RS[i] + RD[i]) continue;
    for (const f of flightsFor(i)){
      if (t < f.fs || t > f.fe) continue;
      const q = ease(lin(t, f.fs, f.fe));
      const x1 = cellX(f.key), y1 = rowY(i) + RH/2;
      chip(o, lerp(f.x0, x1, q), lerp(f.y0, y1, q) - 40*Math.sin(Math.PI*q), f.v, f.c);
    }
  }
  if (t >= T.fly[0] && t <= T.fly[1]){
    const q = ease(lin(t, ...T.fly));
    const x0 = MX1 - 70, y0 = MY0 + 30;
    S.forEach((s, si) => {
      chip(o, lerp(x0, xk(10), q), lerp(y0, yv(s, s.yf), q) - 30*Math.sin(Math.PI*q), f1(s.yf), 'target');
      // towards the target cell, passing under the prediction rows so the features stay visible
      const yc = lerp(y0, rowY(NTRAIN + si) + RH/2, q), under = rowY(NTRAIN) + 3*RH + 16;
      chip(o, lerp(x0, cellX('y'), q), yc + Math.max(0, under - yc)*Math.sin(Math.PI*Math.min(1, q*1.15)), f1(s.yf), 'target');
    });
  }
}

/* ---------------------------------------------------------------- run */
SkfAnim.run({
  title: 'Independent multi-series forecasting',
  desc: 'Three stores with daily sales share a weekly pattern but have different levels, different history lengths ' +
        '(store C opened later) and different exogenous variables (temperature, promotions). ForecasterRecursiveMultiSeries stacks the sliding windows of all stores into a single table with a ' +
        'series column that identifies each store; stores add as many rows as their history allows and missing ' +
        'exogenous variables are filled with NaN. One regressor is fitted on the table and forecasts the next value ' +
        'of every store from its own last values and exogenous variables.',
  total: T.total,
  height: 640,
  still: 41,
  fadeOut: T.fadeOut,
  render(t, o){
    header(t, o, {title:'Independent multi-series forecasting', captions:CAPTIONS, steps:STEPS});
    panels(t, o); table(t, o); model(t, o); chips(t, o);
  }
});
})();
</script>
