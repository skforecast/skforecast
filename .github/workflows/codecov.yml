name: Codecov coverage

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: codecov-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests and collect coverage
        env:
          KERAS_BACKEND: torch
          # NUMBA_DISABLE_JIT: 1  # Disable Numba JIT to capture a better coverage report
        run: |
          pytest \
            --cov=skforecast \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_GLOBAL_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_GLOBAL_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
