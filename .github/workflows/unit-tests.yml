name: Unit Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependency libomp on macOS
      if: startsWith(matrix.platform, 'macos-')
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew install libomp

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Show environment info
      run: |
        python --version
        python -m pip list
        python -c "import sys; print('Python executable:', sys.executable)"
        echo "OS: ${{ runner.os }}"
        echo "Platform: ${{ matrix.platform }}"

    - name: Run tests with pytest
      shell: bash
      env:
        KERAS_BACKEND: torch
      run: |
        if [[ "${{ matrix.platform }}" == macos* ]]; then
          echo "Skipping deep_learning tests on macOS due to MPS issues"
          pytest --ignore=skforecast/deep_learning
        else
          pytest
        fi
