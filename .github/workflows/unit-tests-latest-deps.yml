name: Test Latest Dependencies

permissions:
  contents: read

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-latest:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true  # creates .venv and puts it on PATH for the next steps
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
        prune-cache: true

    - name: Install package and force upgrade all dependencies
      env:
        UV_TORCH_BACKEND: cpu  # CPU-only torch build; the runner has no GPU
      run: |
        uv pip install -e ".[test]"
        uv pip install --upgrade \
          numpy pandas scikit-learn scipy optuna joblib numba tqdm rich \
          statsmodels matplotlib lightgbm xgboost

    - name: Show environment info
      run: |
        python --version
        uv pip list

    - name: Run tests with pytest
      shell: bash
      env:
        KERAS_BACKEND: torch
      run: |
        # -q keeps the log short so failures are easy to find; -ra lists them at the end;
        # verbosity_assertions=2 keeps the full assertion diffs of -vv. Failed tests are
        # also shown as annotations (pytest-github-actions-annotate-failures).
        # A deprecation of pandas raised from skforecast or its tests fails the
        # job here, before the next pandas major release. Dependencies are left
        # out on purpose (the module prefix only matches `skforecast.*`). `-o`
        # is needed: with `-W`, pytest escapes the module and requires an exact
        # match, so the filter never matches. It overrides the `filterwarnings`
        # option of pyproject.toml (not set today). `Pandas4Warning` only exists
        # in pandas 3: do not add this filter to a job with pandas 2, and update
        # it when pandas 4 is released (this job installs it despite the ceiling).
        pytest -q -ra -o verbosity_assertions=2 --exclude-warning-annotations \
          -o "filterwarnings=error::pandas.errors.Pandas4Warning:skforecast"
