name: Docs Page Meta Check

# Every documentation page needs a search engine title and description in
# tools/docs/hooks/page_meta.yml (see tools/docs/hooks/page_meta.py). The docs
# are not built in CI, so this checks the texts without building the site.
on:
  pull_request:
    branches:
      - main
      - '*.x'  # release branches, where feature and fix branches are merged
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/docs/hooks/**'
      - '.github/workflows/docs-page-meta-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check page titles and descriptions
        run: |
          python -m pip install pyyaml
          python tools/docs/hooks/page_meta.py
