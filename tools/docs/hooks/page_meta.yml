# Search engine texts of each page, keyed by its path relative to docs/.
# Read by tools/docs/hooks/page_meta.py, which explains how they are used.
# Every page needs an entry: check them with `python tools/docs/hooks/page_meta.py`.
#
# - title: the <title> tag, before " - Skforecast Docs". Name what people search
#   for, not the API. At most 42 characters, so that the whole tag fits in the
#   60 characters a search result shows (60 for the home page, which has no
#   suffix). The short title of `nav` in mkdocs.yml still names the page in
#   the header, the sidebar and the breadcrumbs.
# - description: the meta description and the summary shown when the page is
#   shared. Between 120 and 160 characters, unique, main keyword first,
#   without en or em dashes.
# - Neither text can contain double quotes or angle brackets (Material writes
#   them unescaped).

# Home, introduction and quick start
README.md:
  title: "skforecast: time series forecasting in Python"
  description: >-
    Time series forecasting in Python with skforecast: machine learning,
    statistical and foundation models, backtesting, tuning and prediction intervals.

introduction-forecasting/introduction-forecasting.md:
  title: Introduction to time series forecasting
  description: >-
    Introduction to time series forecasting with machine learning: lags,
    recursive and direct strategies, global models and backtesting in Python.

quick-start/quick-start-skforecast.ipynb:
  title: "Quick start: forecasting in Python"
  description: >-
    Quick start to time series forecasting in Python with skforecast: train a
    forecaster, predict, backtest and tune its hyperparameters in a few lines.

quick-start/forecaster-parameters.md:
  title: Forecaster parameters explained
  description: >-
    Forecaster parameters in skforecast explained: estimator, lags, window
    features, transformers, categorical features, weights and differentiation.

quick-start/forecaster-attributes.ipynb:
  title: Forecaster attributes explained
  description: >-
    Forecaster attributes in skforecast explained: inspect the estimator, lags,
    window features, last window and residuals stored by a trained forecaster.

quick-start/how-to-install.md:
  title: How to install skforecast
  description: >-
    How to install skforecast in Python with pip or conda: basic installation
    and optional dependencies for statistical models, plotting and deep learning.

quick-start/ai-assisted-forecasting.md:
  title: AI-assisted forecasting with LLMs
  description: >-
    AI-assisted time series forecasting with skforecast: give ChatGPT, Claude,
    Copilot or Cursor up-to-date context files and skills to write accurate code.

