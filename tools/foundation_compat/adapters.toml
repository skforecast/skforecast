# Environments used to check that each foundation model adapter still works
# with its backend library. Single source for `run.py`, the tests in `tests/`
# and `summarize.py`. See the README of this folder.
#
# One table per environment:
#
# - adapter:         adapter class in `skforecast/foundation/_adapters.py`.
# - backend_package: same value as the `backend_package` attribute of the
#                    adapter. Installed as is, as a user does.
# - model_id:        checkpoint loaded by the smoke tests.
# - overrides:       optional, requirements passed to `uv --override`.
# - secrets:         optional, environment variables the smoke tests need.
#                    When one is missing, the smoke tests are skipped.
#
# A unit test (`test_backends_compat_config.py`) checks that every registered
# adapter has an entry here and in the matrix of the workflow.

[chronos]
adapter = "ChronosAdapter"
backend_package = "chronos-forecasting"
model_id = "autogluon/chronos-2-small"

[timesfm25]
adapter = "TimesFM25Adapter"
backend_package = "timesfm[torch]"
model_id = "google/timesfm-2.5-200m-pytorch"

[timesfm3]
adapter = "TimesFM3Adapter"
backend_package = "timesfm[torch]"
model_id = "google/timesfm-3.0-pytorch"

[moirai]
adapter = "MoiraiAdapter"
backend_package = "uni2ts"
model_id = "Salesforce/moirai-2.0-R-small"
# uni2ts requires scipy<1.12 and skforecast requires scipy>=1.12.
overrides = ["scipy>=1.12"]

[tabicl]
adapter = "TabICLAdapter"
backend_package = "tabicl[forecast]"
model_id = "soda-inria/tabicl"

[tabpfn]
adapter = "TabPFNAdapter"
backend_package = "tabpfn-time-series>=1.3"
model_id = "priorlabs/tabpfn-ts"
secrets = ["TABPFN_TOKEN"]

[t0]
adapter = "T0Adapter"
backend_package = "tfc-t0"
model_id = "theforecastingcompany/t0-alpha"

[nori]
adapter = "NoriAdapter"
backend_package = "synthefy-nori"
model_id = "Synthefy/Nori"

[tsicl]
adapter = "TSICLAdapter"
backend_package = "tsicl"
model_id = "taharnbl/TS-ICL"

# The smallest checkpoint, not the default one (Timestral-28M), so that the
# weekly check downloads less.
[timestral]
adapter = "TimestralAdapter"
backend_package = "timestral @ git+https://github.com/mistralai/timestral.git"
model_id = "mistralai/Timestral-5M"

[tirex2]
adapter = "TiRex2Adapter"
backend_package = "tirex-2"
model_id = "NX-AI/TiRex-2"
