# Single source of truth for the docs Examples pages.
#
# The card grids on docs/examples/examples_english.md, examples_spanish.md and
# examples_chinese.md are generated from this file at build time by the mkdocs
# hook tools/docs_hooks/examples_grid.py. Never edit the generated grids in the
# Markdown pages: edit this file instead.
#
# To add a tutorial:
#   1. Append an entry to `examples` with a unique `id`.
#   2. Pick an `icon` shortcode from https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
#      (material-*, fontawesome-*, octicons-* and simple-* are all bundled).
#   3. Pick a `section` from `sections` and tags from `vocabulary`.
#   4. Add a `title`, `summary` and `url` under each language it exists in. A
#      language with no block (or no url) simply does not show the card.
#
# The build fails loudly on a duplicate id, an unknown section, a tag outside
# `vocabulary`, a missing title/summary/url, or an icon that does not exist.

# ---------------------------------------------------------------------------
# Controlled vocabulary for the filter chips.
# `levels` and `topics` are two independent filter groups: selecting several
# values inside a group widens the result (OR), while selecting values across
# both groups narrows it (AND).
# ---------------------------------------------------------------------------
vocabulary:
  levels:
    - beginner
    - intermediate
    - advanced
  topics:
    - single-series
    - global-models
    - statistical
    - deep-learning
    - foundation-models
    - probabilistic
    - interpretability
    - feature-engineering
    - anomaly-detection
    - performance
    - visualization
    - case-study
    - tools

# ---------------------------------------------------------------------------
# Languages. `page` is the file name inside docs/examples/, `label` is the text
# used in the language switcher shown at the top of every examples page.
# ---------------------------------------------------------------------------
languages:
  en:
    page: examples_english.md
    label: English
  es:
    page: examples_spanish.md
    label: Español
  zh:
    page: examples_chinese.md
    label: 中文

# ---------------------------------------------------------------------------
# Localised interface strings.
#   {shown} and {total} are substituted in `count`.
#   `labels` holds the chip text for every value in `vocabulary`.
#   `fallback_note` is optional: when set, it is rendered as a note under the
#   filter bar (used for partially translated pages).
# ---------------------------------------------------------------------------
ui:
  en:
    search_label: Search examples
    search_placeholder: Search examples...
    level: Level
    topic: Topic
    clear: Clear filters
    count: "Showing {shown} of {total} examples"
    count_all: "Showing all {total} examples"
    no_results: No examples match your filters.
    labels:
      beginner: Beginner
      intermediate: Intermediate
      advanced: Advanced
      single-series: Single series
      global-models: Global models
      statistical: Statistical models
      deep-learning: Deep learning
      foundation-models: Foundation models
      probabilistic: Probabilistic
      interpretability: Interpretability
      feature-engineering: Feature engineering
      anomaly-detection: Anomaly detection
      performance: Performance
      visualization: Visualization
      case-study: Case study
      tools: Tools

  es:
    search_label: Buscar ejemplos
    search_placeholder: Buscar ejemplos...
    level: Nivel
    topic: Tema
    clear: Quitar filtros
    count: "Mostrando {shown} de {total} ejemplos"
    count_all: "Mostrando los {total} ejemplos"
    no_results: Ningún ejemplo coincide con los filtros seleccionados.
    labels:
      beginner: Principiante
      intermediate: Intermedio
      advanced: Avanzado
      single-series: Serie única
      global-models: Modelos globales
      statistical: Modelos estadísticos
      deep-learning: Deep learning
      foundation-models: Modelos fundacionales
      probabilistic: Probabilístico
