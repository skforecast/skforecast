      feature-engineering: Ingeniería de variables
      anomaly-detection: Detección de anomalías
      performance: Rendimiento
      visualization: Visualización
      case-study: Caso práctico
      tools: Herramientas

  zh:
    search_label: 搜索示例
    search_placeholder: 搜索示例...
    level: 难度
    topic: 主题
    clear: 清除筛选
