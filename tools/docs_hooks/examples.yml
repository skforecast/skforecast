# ---------------------------------------------------------------------------
# Sections, rendered in this order. A section with no examples in a given
# language is skipped entirely on that page.
# ---------------------------------------------------------------------------
sections:
  - id: getting-started
    en:
      title: "Getting Started: Fundamental Forecasting"
      blurb: >-
        This section provides essential tutorials for users who are just getting started with
        time series forecasting. These examples cover the most fundamental models and techniques
        to help you build a strong foundation in forecasting.
    es:
      title: "Primeros Pasos: Forecasting Fundamental"
      blurb: >-
        Esta sección proporciona tutoriales esenciales para los usuarios que están comenzando con
        el pronóstico de series temporales. Estos ejemplos cubren los modelos y técnicas más
        fundamentales para ayudarte a construir una base sólida en forecasting.
    zh:
      title: "入门指南：基础预测方法"
      blurb: >-
        本节面向时间序列预测初学者，涵盖最常用的模型与技术，帮助你打下扎实的理论与实践基础。

  - id: global-models
    en:
      title: "Global Models: Multi-Series Forecasting"
      blurb: >-
        These tutorials focus on global models and multi-series forecasting, where you can explore
        the use of techniques that handle multiple time series simultaneously and compare
        performance across different forecasting approaches.
    es:
      title: "Modelos Globales: Forecasting Multi-Serie"
      blurb: >-
        Estos tutoriales se centran en modelos globales y en el pronóstico de series múltiples,
        donde puedes explorar el uso de técnicas que manejan varias series temporales
        simultáneamente y comparar el rendimiento entre diferentes enfoques de forecasting.
    zh:
      title: "全局模型：多序列预测"
      blurb: >-
        本节聚焦全局模型与多序列预测，介绍如何用同一个模型同时处理多条时间序列，并比较不同建模策略的表现。

  - id: advanced-techniques
    en:
      title: "Advanced Techniques: Beyond Basic Models"
      blurb: >-
        For experienced users looking to deepen their forecasting skills, this section provides
        advanced techniques, including probabilistic forecasting, handling missing values, and
        more sophisticated ensemble methods.
    es:
      title: "Técnicas Avanzadas: Más Allá de los Modelos Básicos"
      blurb: >-
        Para usuarios experimentados que buscan profundizar en sus habilidades de forecasting,
        esta sección ofrece técnicas avanzadas, como forecasting probabilístico y manejo de
        valores ausentes.
    zh:
      title: "进阶技术：超越基础模型"
      blurb: >-
        本节面向希望深入提升预测能力的用户，涵盖概率预测、缺失值处理以及更复杂的集成方法等进阶技术。

  - id: case-studies
    en:
      title: Real-World Challenges and Case Studies
      blurb: >-
        This section includes real-world applications of time series forecasting to tackle specific
        challenges, such as forecasting energy demand, web traffic, and even cryptocurrency prices.
        Learn how to apply forecasting techniques to practical use cases.
    es:
      title: Desafíos del Mundo Real y Estudios de Caso
      blurb: >-
        Esta sección incluye aplicaciones del mundo real del pronóstico de series temporales para
        abordar desafíos específicos, como el pronóstico de la demanda de energía, el tráfico web
        e incluso los precios de criptomonedas. Aprende cómo aplicar técnicas de forecasting a
        casos prácticos.
    zh:
      title: 真实场景与案例研究
      blurb: >-
        本节展示时间序列预测在真实业务中的应用，例如电力需求预测、网站流量预测，甚至加密货币价格预测。

